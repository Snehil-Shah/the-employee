spec_version: "0.1.0"
name: fairness
version: 0.1.0
description: >-
  Reviews each proposed change to the ideal employee for demographic proxies
  and exclusionary language, and attaches its verdict to the commit as a git
  note. Advises the human; never approves or rejects.

